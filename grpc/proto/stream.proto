syntax = "proto3";

package omnipair.stream;

service StreamService {
  rpc StreamSwapsUpdates(SwapsRequest) returns (stream SwapsUpdate);
  // Native Dusk notifications; never decode them as legacy reserve-ratio swaps.
  rpc StreamDuskChanges(DuskChangesRequest) returns (stream DuskChange);
}

message SwapsRequest {}

message SwapsUpdate {
  string id = 1;
  string pair = 2;
  string user_address = 3;
  bool is_token0_in = 4;
  string amount_in = 5;
  string amount_out = 6;
  string reserve0 = 7;
  string reserve1 = 8;
  string timestamp = 9;
  string tx_sig = 10;
  string slot = 11;
  string fee_paid0 = 12;
  string fee_paid1 = 13;
  string ema_price = 14;
  float price = 15;
  string volume_usd = 16;
}


message DuskChangesRequest {}
message DuskChange {
  // Exact dusk-read-change.v1 success envelope, checked by the native client.
  string envelope_json = 1;
}
