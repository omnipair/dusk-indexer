[package]
name = "dusk-indexer-daemon"
version = "0.1.0"
edition = "2021"
description = "Streams confirmed Dusk transactions and persists every pinned event"

[[bin]]
name = "dusk-indexer-daemon"
path = "src/main.rs"

[dependencies]
dusk-indexer-foundation = { path = "../dusk-ingestion" }
carbon-core = { workspace = true }
carbon-helius-atlas-ws-datasource = { workspace = true }
carbon-log-metrics = { workspace = true }
carbon-prometheus-metrics = { workspace = true }
helius = { workspace = true }
async-trait = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
solana-client = { workspace = true }
solana-instruction = { workspace = true }
solana-account-decoder-client-types = { workspace = true }
solana-transaction = { workspace = true }
solana-transaction-status = { workspace = true }
solana-commitment-config = { workspace = true }
solana-signature = { workspace = true }
solana-pubkey = { workspace = true }
solana-account = { workspace = true }
serde = { workspace = true }
serde_json = "1"
base64 = { workspace = true }
bs58 = { version = "0.5.1", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
sha2 = "0.10"
