[package]
name = "dusk-indexer-daemon"
version = "0.1.0"
edition = "2021"
description = "Polls a live cluster for Dusk transactions and persists every pinned event"

[[bin]]
name = "dusk-indexer-daemon"
path = "src/main.rs"

[dependencies]
dusk-indexer-foundation = { path = "../dusk-ingestion" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
solana-client = { workspace = true }
solana-transaction-status = { workspace = true }
solana-commitment-config = { workspace = true }
solana-signature = { workspace = true }
solana-pubkey = { workspace = true }
serde_json = "1"
bs58 = { version = "0.5.1", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
