name: Publish reviewed AWS images
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Require successful main CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run list --repo "$GITHUB_REPOSITORY" --workflow dusk.yml
          --branch main --commit "$GITHUB_SHA" --event push
          --json status,conclusion |
          jq -e 'any(.[]; .status == "completed" and .conclusion == "success")'
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.DUSK_AWS_IMAGE_PUBLISHER_ROLE }}
          aws-region: ap-southeast-1
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Publish immutable API, indexer and gRPC images
        env:
          API_REPOSITORY: ${{ vars.DUSK_ECR_API_REPOSITORY }}
          INDEXER_REPOSITORY: ${{ vars.DUSK_ECR_INDEXER_REPOSITORY }}
          GRPC_REPOSITORY: ${{ vars.DUSK_ECR_GRPC_REPOSITORY }}
        run: |
          set -euo pipefail
          tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          for kind in api indexer grpc; do
            case "$kind" in
              api) repository="$API_REPOSITORY"; dockerfile=Dockerfile.dusk-api ;;
              indexer) repository="$INDEXER_REPOSITORY"; dockerfile=Dockerfile.dusk-indexer ;;
              grpc) repository="$GRPC_REPOSITORY"; dockerfile=Dockerfile.grpc ;;
            esac
            [[ "$repository" =~ ^[0-9]{12}\.dkr\.ecr\.ap-southeast-1\.amazonaws\.com/[a-z0-9/_-]+$ ]]
            docker buildx build --platform linux/amd64 --file "$dockerfile" \
              --tag "$repository:$tag" --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --provenance=true --sbom=true --push --metadata-file "$kind-image.json" .
            digest=$(jq -r '.["containerimage.digest"]' "$kind-image.json")
            # shellcheck disable=SC2016
            printf '%s: `%s@%s`\n\n' "$kind" "$repository" "$digest" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: aws-images-${{ github.sha }}
          path: '*-image.json'
