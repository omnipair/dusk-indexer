name: Dusk native integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dusk-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  aws-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/aws/infra/package-lock.json
      - run: npm ci
        working-directory: deploy/aws/infra
      - run: npm run typecheck && npm test
        working-directory: deploy/aws/infra
      - name: Synthesize both foundation and service fleets without AWS credentials
        working-directory: deploy/aws/infra
        env:
          DUSK_AWS_CONFIG: release.config.example.json
        run: |
          npm run synth -- --no-lookups --quiet
          npm run synth -- --no-lookups --quiet -c services=true --output cdk.out.services
      - name: Validate bootstrap and workflows
        run: |
          shellcheck deploy/aws/infra/assets/database.sh deploy/aws/infra/assets/keeper-migrations/initialize.sh deploy/aws/infra/test/bootstrap-database.sh
          node --check deploy/aws/infra/scripts/aws-cli.mjs
          node --check deploy/aws/infra/scripts/seed-runtime.mjs
      - name: Exercise production bootstrap on the exact pinned TimescaleDB image
        run: sudo --preserve-env=CI bash deploy/aws/infra/test/bootstrap-database.sh
  native-grpc:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2025-09-28
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly-2025-09-28 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo test --locked -p omnipair-grpc-server
  native-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dusk_test
          POSTGRES_DB: dusk_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dusk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dusk_test@localhost:5432/dusk_test?sslmode=disable
      DUSK_ALLOW_DISPOSABLE_DB_TESTS: 'true'
      RUSTUP_TOOLCHAIN: nightly-2025-09-28
      DUSK_CLUSTER: mainnet-beta
      DUSK_RPC_URL: https://api.mainnet-beta.solana.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: rustup toolchain install nightly-2025-09-28 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt -p dusk-indexer-foundation -p dusk-indexer-daemon --check
      - run: cargo clippy --locked -p dusk-indexer-foundation -p dusk-indexer-daemon --all-targets -- -D warnings
      - run: cargo test --locked -p dusk-indexer-foundation -p dusk-indexer-daemon
      - name: Apply and verify the canonical migration manifest
        run: |
          DUSK_MIGRATE_ONLY=true bash scripts/dusk-indexer-entrypoint.sh
          DUSK_MIGRATE_ONLY=true bash scripts/dusk-indexer-entrypoint.sh
          psql "$DATABASE_URL" -X -f database/tests/native-account-projections.sql
          psql "$DATABASE_URL" -X -f database/tests/lp-ownership.sql
      - run: npm ci
        working-directory: api
      - run: npm run test:unit
        working-directory: api
      - name: Rollback-only database integration
        working-directory: api
        run: node --test --test-concurrency=1 dist/tests/*.integration.js
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file Dockerfile.dusk-indexer --tag dusk-indexer:test .
      - run: docker build --file Dockerfile.dusk-api --tag dusk-api:test .
      - run: docker build --file Dockerfile.grpc --tag dusk-grpc:test .
      - run: docker run --rm --network none dusk-grpc:test --help
      - name: Verify pinned artifacts and migrations in the actual images
        run: |
          docker run --rm --network none --entrypoint sh dusk-indexer:test -c 'while read name; do if ! test -f "/app/migrations/$name"; then echo "Missing packaged migration: $name" >&2; exit 1; fi; done < /app/dusk-migrations.txt'
          docker run --rm --network none --entrypoint node dusk-api:test -e 'const pin=require("./dist/config/duskProtocol").loadPinnedProtocol(); if(pin.cluster!=="mainnet-beta")process.exit(1); console.log(pin.revision)'

  history-timescale:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: history-timescale
            image: timescale/timescaledb:latest-pg16@sha256:f495f2bc25ca7596ca8e1606c6241ca250ccc56a0c082b9f2ec0d290e0126cd9
            major: 16
          - check: history-timescale-pg17
            # Same immutable image as the running Railway Dusk database.
            image: timescale/timescaledb:2.29.2-pg17@sha256:bc8527e62f70f0766b29515077965025872fabb5349db421565f69ee273baf2d
            major: 17
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: dusk_test
          POSTGRES_DB: dusk_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dusk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dusk_test@localhost:5432/dusk_test?sslmode=disable
      DUSK_ALLOW_DISPOSABLE_DB_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Apply migrations on actual hypertables
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS timescaledb'
          DUSK_MIGRATE_ONLY=true bash scripts/dusk-indexer-entrypoint.sh
          DUSK_MIGRATE_ONLY=true bash scripts/dusk-indexer-entrypoint.sh
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM timescaledb_information.hypertables WHERE hypertable_schema='dusk_ingestion' AND hypertable_name='event_stream') THEN RAISE EXCEPTION 'Native stream is not a hypertable'; END IF; END \$\$;"
      - name: Verify the exact Railway database versions
        if: matrix.major == 17
        run: |
          test "$(psql "$DATABASE_URL" -X -Atc 'SHOW server_version')" = '17.11'
          test "$(psql "$DATABASE_URL" -X -Atc "SELECT extversion FROM pg_extension WHERE extname='timescaledb'")" = '2.29.2'
      - run: npm ci
        working-directory: api
      - run: npm run build
        working-directory: api
      - name: Native history, cache, and chart database regressions
        working-directory: api
        run: >-
          node --test --test-concurrency=1
          dist/tests/duskEventHistory.integration.js
          dist/tests/duskQuoteHistory.integration.js
          dist/tests/duskArchivedQuoteHistory.integration.js
